name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Prepare output directory
        run: mkdir -p profile

      - name: Generate the two cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/cards.mjs

      - name: Publish cards to output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          publish_dir="$(mktemp -d)"
          mkdir -p "$publish_dir/profile"
          cp profile/*.svg "$publish_dir/profile/"
          cd "$publish_dir"
          git init --initial-branch=output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add profile/*.svg
          git commit -m "Update README cards"
          git push --force origin output
